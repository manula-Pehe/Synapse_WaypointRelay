spring.application.name=waypoint

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/waypoint}
spring.datasource.username=${DB_USER:waypoint}
spring.datasource.password=${DB_PASSWORD:waypoint}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Frontend origins allowed to call the API (comma separated, wildcards allowed)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
# Folder with the competition dataset (never committed)
app.data-dir=${APP_DATA_DIR:../data}
# Demo starting point (used only when nothing is stored in app_settings yet)
app.demo.start=${DEMO_START:2026-09-30T14:00:00+05:30}
app.demo.run-date=${DEMO_RUN_DATE:2026-10-01}
